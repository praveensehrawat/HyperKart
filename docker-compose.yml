version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: hyperkart-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-changeme}
      - MONGO_INITDB_DATABASE=hyperkartdb
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend/demo
    container_name: hyperkart-backend
    ports:
      - "8085:8085"
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/hyperkartdb?authSource=admin
      - AI_SERVICE_URL=http://ai-service:8000
      - SERVER_PORT=8085
      - JWT_SECRET=${JWT_SECRET:-hyperkart-commerce-jwt-secret-key-change-in-production-min-256-bits}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@hyperkart.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminPassword123!}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      - mongo
    volumes:
      - uploads-data:/app/uploads
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    container_name: hyperkart-ai-service
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hyperkart-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
  uploads-data:
