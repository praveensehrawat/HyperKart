<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- SEO and UX: Proper descriptive page title -->
    <title>HYPERKART Commerce - Shop Local, Deliver Fast</title>
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
      (function() {
        const saved = localStorage.getItem('app-theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('theme-dark');
          document.documentElement.classList.add('theme-light');
          document.documentElement.style.backgroundColor = '#f8fafc';
          document.documentElement.style.color = '#0f172a';
        } else {
          document.documentElement.classList.remove('theme-light');
          document.documentElement.classList.add('theme-dark');
          document.documentElement.style.backgroundColor = '#0b0f19';
          document.documentElement.style.color = '#f3f4f6';
          localStorage.setItem('app-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- React DOM mounting target -->
    <div id="root">
      <noscript>
        <div style="padding: 2rem; text-align: center; font-family: sans-serif; color: #ef4444;">
          <h2>JavaScript Required</h2>
          <p>Please enable JavaScript to run this HYPERKART Commerce Web Application.</p>
        </div>
      </noscript>
    </div>
    <!-- Entry script loader -->
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
