# ==============================================================================
# HYPERKART Commerce Backend Spring Boot Properties Configuration
# ==============================================================================

# Application context identifier
spring.application.name=HYPERKART-commerce

# MongoDB Connection String: local fallback default; overrides with Atlas MONGODB_URI or SPRING_DATA_MONGODB_URI env
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:${SPRING_MONGODB_URI:mongodb://localhost:27017/hyperkartdb}}}
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:${SPRING_MONGODB_URI:mongodb://localhost:27017/hyperkartdb}}}
# Auto-index database structures (such as 2dsphere indexes for Seller geolocations)
spring.data.mongodb.auto-index-creation=true

# Disable Spring auto-config for unused relational datasources (project uses MongoDB only)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Server configuration port and network binding (supports Render PORT env var)
server.port=${PORT:${SERVER_PORT:8085}}
# Bind to all network interfaces so mobile devices on WiFi can connect
server.address=0.0.0.0

# JSON Web Token parameters (Change secret in production)
jwt.secret=${JWT_SECRET:HYPERKART-commerce-jwt-secret-key-change-in-production-min-256-bits}
# Expiration schedule (default: 24 Hours)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OpenAI configuration variables (Personalized search fallback uses local scoring if empty)
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Google Maps API key context (Backend geocoding operations)
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# AI Microservice URL (FastAPI endpoints destination)
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}

# Allowed Cross-Origin Origins (CORS mapping)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Hot-restart configuration
spring.devtools.restart.enabled=false

# Cache configuration strategy: Simple local cache mapping
spring.cache.type=simple

# Single Designated System Administrator Email
app.admin.email=${ADMIN_EMAIL:admin@HYPERKART.com}
app.admin.password=${ADMIN_PASSWORD:AdminPassword123!}

